[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Attackon3DVLMS"
version = "0.0.1"
description = ""
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "accelerate", "einops", "fastapi", "gradio", "markdown2[all]", "numpy",
    "requests", "sentencepiece", "tokenizers==0.15.1",
    "torch>=2.0", "torchvision", "pytorch3d", "uvicorn", "wandb",
    "shortuuid",
    "deepspeed", "peft",
    "transformers==4.37.2",
    "openai", "tqdm",
    "easydict", "timm==0.4.12", "ftfy==6.0.1", "regex", "open3d==0.16.0", "h5py", "termcolor",
    "plyfile", "nltk", "rouge", "scikit-learn", "py-rouge", "mayavi", "seaborn", "omegaconf"
]

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]
